[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "music-dup"
version = "0.1.0"
description = "Acoustic duplicate song scanner, quality ranker, and quarantine CLI tool"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pyacoustid>=1.3.0",
    "mutagen>=1.48.0",
    "rich>=13.0.0",
    "click>=8.1.0",
    "requests>=2.28.0",
    "customtkinter>=6.0.0",
    "pillow>=10.0.0",
    "pygame>=2.5.0",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.scripts]
music-dup = "music_dup.cli:main"
music-dup-gui = "music_dup.cli:gui_main"
sounddup = "music_dup.cli:main"

[tool.setuptools.packages.find]
where = ["."]
